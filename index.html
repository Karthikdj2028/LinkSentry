<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkSentry | Advanced Phishing Detection & Threat Intelligence</title>
    <meta name="description" content="LinkSentry - Next-generation AI-powered phishing defense, scanning URLs, QR codes, and SMS messages for cybersecurity threats." />
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('linksentry_theme');
          var systemIsLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var resolved = (saved === 'light' || saved === 'dark') ? saved : (systemIsLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
