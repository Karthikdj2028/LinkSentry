name: LinkSentry Selenium E2E Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Selenium E2E Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E Dependencies
        working-directory: e2e
        run: npm ci

      - name: Generate QR Test Fixtures
        working-directory: e2e
        run: npm run generate:fixtures

      - name: Execute Selenium E2E Test Suites
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://linksentry-7e694.web.app' }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          BROWSER: 'chrome'
          HEADLESS: 'true'
        run: npm test

      - name: Upload Mochawesome HTML & JSON Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-e2e-report
          path: e2e/reports/mochawesome/
          retention-days: 14

      - name: Upload Excel E2E Spreadsheet Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel-e2e-report
          path: e2e/reports/E2E_Report.xlsx
          retention-days: 14

      - name: Upload Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-failure-screenshots
          path: e2e/screenshots/
          retention-days: 14

      - name: Upload Winston Execution Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-execution-logs
          path: e2e/logs/
          retention-days: 14
