name: LinkSentry QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  selenium:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Selenium Web Tests
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          SELENIUM_BASE_URL: https://linksentry-7e694.web.app
        run: |
          node qa/selenium/tests/selenium-suite-runner.js


  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start FastAPI Backend
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/linksentry-api.log 2>&1 &

          sleep 10

      - name: Verify Backend
        run: |
          curl --fail http://127.0.0.1:8000/api/health

      - name: Run Load Test
        env:
          K6_BASE_URL: http://127.0.0.1:8000
        run: |
          node qa/k6/scenarios/k6-suite-runner.js
          
  appium:
    name: Appium Android Tests
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Android Environment
        shell: powershell
        run: |
          $androidHome = "C:\Users\acer\AppData\Local\Android\Sdk"

          if (-not (Test-Path "$androidHome\platform-tools\adb.exe")) {
            throw "ADB not found at $androidHome\platform-tools\adb.exe"
          }

          "ANDROID_HOME=$androidHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$androidHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "$androidHome\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$androidHome\emulator" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Android SDK configured: $androidHome"

      - name: Verify Android Device
        shell: powershell
        run: |
          Write-Host "ADB location:"
          where.exe adb

          Write-Host "ADB version:"
          adb version

          Write-Host "Connected devices:"
          adb devices

          $deviceId = "R9ZY105SN5M"
          $deviceState = (& adb devices) |
            Select-String -Pattern "^\s*$deviceId\s+device\s*$"

          if (-not $deviceState) {
            Write-Host "ADB device list:"
            adb devices
            throw "Samsung device $deviceId is not connected or authorized."
          }

          Write-Host "Samsung device $deviceId detected successfully."

          Write-Host "Device model:"
          adb -s $deviceId shell getprop ro.product.model

          Write-Host "Android API:"
          adb -s $deviceId shell getprop ro.build.version.sdk

      - name: Verify Appium Server
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:4723/status" `
            -UseBasicParsing

          Write-Host $response.Content

          if ($response.StatusCode -ne 200) {
            throw "Appium server is not available."
          }

          Write-Host "Appium server is available."

      - name: Verify Appium Driver
        shell: powershell
        run: |
          npx appium driver list --installed

      - name: Run Real Appium Tests
        shell: powershell
        run: |
          node qa/appium/tests/appium-suite-runner.js
