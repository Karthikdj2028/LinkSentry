name: LinkSentry QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  selenium:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Selenium Web Tests
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          SELENIUM_BASE_URL: https://linksentry-7e694.web.app
        run: |
          node qa/selenium/tests/selenium-suite-runner.js


  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start FastAPI Backend
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/linksentry-api.log 2>&1 &

          sleep 10

      - name: Verify Backend
        run: |
          curl --fail http://127.0.0.1:8000/api/health

      - name: Run Load Test
        env:
          K6_BASE_URL: http://127.0.0.1:8000
        run: |
          node qa/k6/scenarios/k6-suite-runner.js


  appium:
    name: Appium Android Tests
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Android Device
        shell: powershell
        run: |
          adb devices
          adb shell getprop ro.product.model
          adb shell getprop ro.build.version.sdk

      - name: Verify Appium Server
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:4723/status" `
            -UseBasicParsing

          if ($response.StatusCode -ne 200) {
            throw "Appium server is not available."
          }

          Write-Host "Appium server is available."

      - name: Run Real Appium Tests
        shell: powershell
        env:
          ANDROID_HOME: C:\Users\acer\AppData\Local\Android\Sdk
          ANDROID_SDK_ROOT: C:\Users\acer\AppData\Local\Android\Sdk
        run: |
          node qa/appium/tests/appium-suite-runner.js
