name: LinkSentry QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  selenium:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix e2e ci

      - name: Build Web Application
        run: npm run build

      - name: Serve Web Application on Port 4174
        run: |
          npx vite preview --port 4174 --host 127.0.0.1 &
          sleep 5

      - name: Verify Web Server Reachable
        run: |
          curl --fail http://127.0.0.1:4174

      - name: Run Selenium Web E2E Suite
        env:
          HEADLESS: "true"
          E2E_BASE_URL: "http://127.0.0.1:4174"
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          npm --prefix e2e test


  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start FastAPI Backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          nohup python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/linksentry-api.log 2>&1 &

          sleep 5

      - name: Verify Backend
        run: |
          curl --fail http://127.0.0.1:8000/api/health

      - name: Run Load Test
        env:
          K6_BASE_URL: http://127.0.0.1:8000
        run: |
          node qa/k6/scenarios/k6-suite-runner.js


  appium:
    name: Appium Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies & Appium UiAutomator2 driver
        run: |
          npm ci
          npx appium driver install uiautomator2 || true

      - name: Start Appium Server
        run: |
          npx appium --address 127.0.0.1 --port 4723 --log /tmp/appium.log &
          sleep 5

      - name: Verify Appium Server
        run: |
          curl --fail http://127.0.0.1:4723/status

      - name: Run Android Emulator & Appium Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            adb devices
            ANDROID_SERIAL=$(adb devices | grep -m 1 'emulator' | awk '{print $1}')
            echo "Detected Android Emulator Serial: $ANDROID_SERIAL"
            ANDROID_SERIAL=${ANDROID_SERIAL:-emulator-5554} ANDROID_DEVICE_NAME="Android Emulator" APPIUM_HOST="127.0.0.1" APPIUM_PORT="4723" node qa/appium/tests/appium-suite-runner.js
