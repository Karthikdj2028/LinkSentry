name: LinkSentry Mobile E2E Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mobile-e2e:
    name: Appium Mobile E2E (300+ Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx uvicorn

      - name: Start LinkSentry FastAPI Backend
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/api/health; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Install Appium Dependencies
        run: |
          npm ci
          cd frontend/appium-tests && npm install && cd ../..
          npm install -g appium@latest
          appium driver install uiautomator2 || true

      - name: Build LinkSentry Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Run Mobile Tests or Record Execution Status
        run: |
          npm run test:mobile

      - name: Generate Mobile Excel Report & Inventory
        if: always()
        run: |
          npm run test:mobile:report
          npm run test:mobile:inventory

      - name: Upload Mobile Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-reports
          path: |
            test-reports/mobile/Mobile_Test_Report.xlsx
            frontend/appium-tests/reports/
            frontend/appium-tests/screenshots/
            frontend/appium-tests/logs/
            frontend/appium-tests/raw-test-results/
          retention-days: 14
