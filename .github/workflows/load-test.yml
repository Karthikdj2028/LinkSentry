name: LinkSentry Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Base URL for load test'
        required: false
        default: 'https://linksentry-api.onrender.com'
  schedule:
    # Weekly performance baseline run on Sunday at midnight UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  load-test:
    name: Execute k6 Load Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6 CLI
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        env:
          LOAD_TEST_BASE_URL: ${{ github.event.inputs.target_url || 'https://linksentry-api.onrender.com' }}
        run: |
          k6 run loadtest/scenarios/api-load.test.js

      - name: Upload Load Test Summary Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linksentry-load-test-report
          path: loadtest/reports/
          retention-days: 14
