name: LinkSentry Load & Performance Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Base URL for Load Testing'
        required: true
        default: 'http://127.0.0.1:8000'

jobs:
  load-test:
    name: Load & Performance Testing (300+ Scenarios + 300 VU Baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx uvicorn

      - name: Install Load Test Dependencies
        run: |
          npm ci
          cd load-tests && npm install && cd ..

      - name: Start LinkSentry FastAPI Backend
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/api/health; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Execute 300+ Load Test Scenarios
        run: |
          npm run test:load

      - name: Execute Mandatory 300-VU Baseline (1 Minute Sustained Load)
        run: |
          npm run test:load:baseline-300

      - name: Generate Load Excel Report & Inventory
        if: always()
        run: |
          npm run test:load:report
          npm run test:load:inventory

      - name: Upload Load Testing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-performance-reports
          path: |
            test-reports/load/Load_Test_Report.xlsx
            load-tests/results/
            load-tests/raw-results/
          retention-days: 14
