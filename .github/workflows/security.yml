name: LinkSentry Security & Vulnerability Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly deep security scan on Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-and-dependency-scan:
    name: SAST, Dependency & Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Run Bandit AST Security Scan
        run: |
          pip install bandit
          bandit -r backend -x "backend/.venv,backend/__pycache__" -ll

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Run npm Audit (High & Critical)
        run: |
          npm audit --audit-level=high

      - name: Secret Detection & Credential Pattern Check
        run: |
          echo "Scanning for accidental committed private keys and tokens..."
          ! grep -rEn "BEGIN [A-Z ]*PRIVATE KEY" --exclude-dir={.git,.github,.venv,node_modules,dist,build,coverage} . || exit 1
          echo "No private keys detected in repository."
