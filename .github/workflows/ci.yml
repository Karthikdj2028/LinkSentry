name: LinkSentry CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Backend / ML Threat API Test Suite
  # ============================================================================
  backend-tests:
    name: Backend API & Threat Engine Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Execute pytest test suite
        run: |
          python -m pytest backend/tests/ -v --junitxml=pytest-results.xml

      - name: Upload Pytest Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: pytest-results.xml
          retention-days: 14

  # ============================================================================
  # 2. Web Frontend Build & Lint
  # ============================================================================
  web-build:
    name: Web Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  # ============================================================================
  # 3. Android Unit Tests
  # ============================================================================
  android-unit-tests:
    name: Android Native Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Android Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  # ============================================================================
  # 4. Android Debug Build
  # ============================================================================
  android-build:
    name: Android Native Debug Build
    needs: [android-unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linksentry-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ============================================================================
  # 5. Security Baseline Verification
  # ============================================================================
  security-scan:
    name: Automated Security Baseline & SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Bandit AST Security Scan on Backend
        run: |
          pip install bandit
          bandit -r backend -ll -f txt -o bandit-report.txt || true
          cat bandit-report.txt
          bandit -r backend -ll

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Audit npm dependencies
        run: |
          npm audit --audit-level=high

      - name: Scan for accidental private keys / credential patterns
        run: |
          echo "Scanning for accidental committed private keys and PEM credentials..."
          ! grep -rEn "BEGIN [A-Z ]*PRIVATE KEY" --exclude-dir={.git,.github,.venv,node_modules,dist,build,coverage} . || exit 1
          echo "Secret scan clean: No unencrypted private key material detected."

  # ============================================================================
  # 6. Firestore Security Rules Tests (Local Emulator)
  # ============================================================================
  firestore-rules-tests:
    name: Firestore Security Rules (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Set up Java 21 (Required for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Firestore Security Rules Tests
        run: |
          npx -y firebase-tools@latest emulators:exec --only firestore "node --test tests-firestore/firestore.rules.test.js"

  # ============================================================================
  # 7. CI Smoke Gate
  # ============================================================================
  ci-smoke:
    name: CI Smoke & Release Gate
    needs: [backend-tests, web-build, android-unit-tests, android-build, security-scan, firestore-rules-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify All Gates Passed
        run: |
          echo "============================================================"
          echo "LinkSentry Production CI/CD Gate Verification Passed!"
          echo "✓ Backend API & Threat Engine Unit Tests Passed"
          echo "✓ Web Frontend Build & ESLint Passed"
          echo "✓ Android Native Unit Tests Passed"
          echo "✓ Android Native Debug Build Passed"
          echo "✓ Security Baseline & SAST Passed"
          echo "✓ Firestore Security Rules & Authorization Tests Passed"
          echo "============================================================"